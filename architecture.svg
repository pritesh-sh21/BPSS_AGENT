<svg width="100%" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg" role="img">
<title>BPSS Agent Architecture</title>
<desc>Four-layer system: ingestion, tools, LangGraph agent, output</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: sans-serif; fill: #1a1a1a; }
    .th  { font-size: 14px; font-weight: 500; }
    .ts  { font-size: 12px; font-weight: 400; fill: #555; }
    /* layer fills */
    .l1  { fill: #E1F5EE; stroke: #0F6E56; }
    .l2  { fill: #EEEDFE; stroke: #534AB7; }
    .l3  { fill: #E6F1FB; stroke: #185FA5; }
    .l4  { fill: #FAEEDA; stroke: #854F0B; }
    /* node fills */
    .n-teal   { fill: #9FE1CB; stroke: #0F6E56; }
    .n-purple { fill: #CECBF6; stroke: #534AB7; }
    .n-gray   { fill: #F1EFE8; stroke: #888780; }
    .n-coral  { fill: #F5C4B3; stroke: #993C1D; }
    .n-blue   { fill: #B5D4F4; stroke: #185FA5; }
    .n-amber  { fill: #FAC775; stroke: #854F0B; }
    /* text on colored nodes */
    .on-teal   { fill: #085041; }
    .on-purple { fill: #3C3489; }
    .on-coral  { fill: #712B13; }
    .on-blue   { fill: #0C447C; }
    .on-amber  { fill: #633806; }
    .on-gray   { fill: #2C2C2A; }
  </style>
</defs>

<!-- LAYER 1 -->
<rect x="40" y="24" width="600" height="108" rx="14" class="l1" stroke-width="0.5"/>
<text class="th on-teal" x="340" y="50" text-anchor="middle" dominant-baseline="central">Layer 1 — ingestion</text>
<text class="ts on-teal" x="340" y="68" text-anchor="middle" dominant-baseline="central">ingest.py · parses all 14 files once at startup into BPSSKnowledgeStore</text>
<rect x="60"  y="86" width="68" height="28" rx="6" class="n-gray" stroke-width="0.5"/>
<text class="ts on-gray" x="94"  y="100" text-anchor="middle" dominant-baseline="central">2 × PDF</text>
<rect x="138" y="86" width="80" height="28" rx="6" class="n-gray" stroke-width="0.5"/>
<text class="ts on-gray" x="178" y="100" text-anchor="middle" dominant-baseline="central">8 × DOCX</text>
<rect x="228" y="86" width="72" height="28" rx="6" class="n-gray" stroke-width="0.5"/>
<text class="ts on-gray" x="264" y="100" text-anchor="middle" dominant-baseline="central">1 × XLSX</text>
<rect x="310" y="86" width="72" height="28" rx="6" class="n-gray" stroke-width="0.5"/>
<text class="ts on-gray" x="346" y="100" text-anchor="middle" dominant-baseline="central">3 × CSV</text>
<rect x="396" y="86" width="224" height="28" rx="6" class="n-teal" stroke-width="0.5"/>
<text class="ts on-teal" x="508" y="100" text-anchor="middle" dominant-baseline="central">6 candidates keyed by ID</text>

<line x1="340" y1="132" x2="340" y2="158" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- LAYER 2 -->
<rect x="40" y="158" width="600" height="204" rx="14" class="l2" stroke-width="0.5"/>
<text class="th on-purple" x="340" y="184" text-anchor="middle" dominant-baseline="central">Layer 2 — business logic tools</text>
<text class="ts on-purple" x="340" y="202" text-anchor="middle" dominant-baseline="central">8 deterministic Python functions · zero LLM · returns issues + citations</text>

<rect x="60"  y="216" width="148" height="44" rx="8" class="n-gray" stroke-width="0.5"/>
<text class="th on-gray" x="134" y="234" text-anchor="middle" dominant-baseline="central">check_freshness</text>
<text class="ts on-gray" x="134" y="251" text-anchor="middle" dominant-baseline="central">address 90-day rule</text>

<rect x="220" y="216" width="148" height="44" rx="8" class="n-gray" stroke-width="0.5"/>
<text class="th on-gray" x="294" y="234" text-anchor="middle" dominant-baseline="central">check_employment</text>
<text class="ts on-gray" x="294" y="251" text-anchor="middle" dominant-baseline="central">3-year coverage</text>

<rect x="380" y="216" width="116" height="44" rx="8" class="n-gray" stroke-width="0.5"/>
<text class="th on-gray" x="438" y="234" text-anchor="middle" dominant-baseline="central">check_rtw</text>
<text class="ts on-gray" x="438" y="251" text-anchor="middle" dominant-baseline="central">RTW evidence matrix</text>

<rect x="508" y="216" width="112" height="44" rx="8" class="n-gray" stroke-width="0.5"/>
<text class="th on-gray" x="564" y="234" text-anchor="middle" dominant-baseline="central">check_crim</text>
<text class="ts on-gray" x="564" y="251" text-anchor="middle" dominant-baseline="central">DBS / disclosure</text>

<rect x="60"  y="272" width="148" height="44" rx="8" class="n-gray" stroke-width="0.5"/>
<text class="th on-gray" x="134" y="290" text-anchor="middle" dominant-baseline="central">check_adjudication</text>
<text class="ts on-gray" x="134" y="307" text-anchor="middle" dominant-baseline="central">register entries</text>

<rect x="220" y="272" width="148" height="44" rx="8" class="n-gray" stroke-width="0.5"/>
<text class="th on-gray" x="294" y="290" text-anchor="middle" dominant-baseline="central">detect_contradictions</text>
<text class="ts on-gray" x="294" y="307" text-anchor="middle" dominant-baseline="central">tracker vs evidence</text>

<rect x="380" y="272" width="116" height="44" rx="8" class="n-gray" stroke-width="0.5"/>
<text class="th on-gray" x="438" y="290" text-anchor="middle" dominant-baseline="central">check_staleness</text>
<text class="ts on-gray" x="438" y="307" text-anchor="middle" dominant-baseline="central">expired docs</text>

<rect x="508" y="272" width="112" height="44" rx="8" class="n-purple" stroke-width="0.5"/>
<text class="th on-purple" x="564" y="290" text-anchor="middle" dominant-baseline="central">assess_closure</text>
<text class="ts on-purple" x="564" y="307" text-anchor="middle" dominant-baseline="central">master tool</text>

<line x1="340" y1="362" x2="340" y2="390" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- LAYER 3 -->
<rect x="40" y="390" width="600" height="212" rx="14" class="l3" stroke-width="0.5"/>
<text class="th on-blue" x="340" y="416" text-anchor="middle" dominant-baseline="central">Layer 3 — LangGraph agent</text>
<text class="ts on-blue" x="340" y="434" text-anchor="middle" dominant-baseline="central">question → planner → executor → synthesiser → answer</text>

<rect x="62"  y="452" width="160" height="68" rx="10" class="n-coral" stroke-width="0.5"/>
<text class="th on-coral" x="142" y="474" text-anchor="middle" dominant-baseline="central">planner</text>
<text class="ts on-coral" x="142" y="492" text-anchor="middle" dominant-baseline="central">LLM picks tools</text>
<text class="ts on-coral" x="142" y="508" text-anchor="middle" dominant-baseline="central">JSON plan output</text>

<rect x="260" y="452" width="160" height="68" rx="10" class="n-gray" stroke-width="0.5"/>
<text class="th on-gray" x="340" y="474" text-anchor="middle" dominant-baseline="central">executor</text>
<text class="ts on-gray" x="340" y="492" text-anchor="middle" dominant-baseline="central">runs tools (no LLM)</text>
<text class="ts on-gray" x="340" y="508" text-anchor="middle" dominant-baseline="central">deterministic</text>

<rect x="458" y="452" width="160" height="68" rx="10" class="n-coral" stroke-width="0.5"/>
<text class="th on-coral" x="538" y="474" text-anchor="middle" dominant-baseline="central">synthesiser</text>
<text class="ts on-coral" x="538" y="492" text-anchor="middle" dominant-baseline="central">LLM writes answer</text>
<text class="ts on-coral" x="538" y="508" text-anchor="middle" dominant-baseline="central">cites sources</text>

<line x1="222" y1="486" x2="256" y2="486" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420" y1="486" x2="454" y2="486" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="62" y="538" width="556" height="30" rx="8" class="n-blue" stroke-width="0.5"/>
<text class="ts on-blue" x="340" y="553" text-anchor="middle" dominant-baseline="central">LLM: meta-llama/Llama-3.1-8B-Instruct via HuggingFace Inference API</text>

<text class="ts" x="340" y="586" text-anchor="middle" dominant-baseline="central" fill="#888780">tool results flattened to ~7KB before synthesiser (avoids 40KB context overflow)</text>

<line x1="340" y1="602" x2="340" y2="630" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- LAYER 4 -->
<rect x="40" y="630" width="600" height="112" rx="14" class="l4" stroke-width="0.5"/>
<text class="th on-amber" x="340" y="658" text-anchor="middle" dominant-baseline="central">Layer 4 — output</text>
<text class="ts on-amber" x="340" y="676" text-anchor="middle" dominant-baseline="central">plain-text answer · every fact cited to exact file, row, and field</text>

<rect x="60"  y="692" width="168" height="32" rx="8" class="n-gray" stroke-width="0.5"/>
<text class="ts on-gray" x="144" y="708" text-anchor="middle" dominant-baseline="central">closure verdicts</text>
<rect x="242" y="692" width="168" height="32" rx="8" class="n-gray" stroke-width="0.5"/>
<text class="ts on-gray" x="326" y="708" text-anchor="middle" dominant-baseline="central">contradiction reports</text>
<rect x="424" y="692" width="168" height="32" rx="8" class="n-gray" stroke-width="0.5"/>
<text class="ts on-gray" x="508" y="708" text-anchor="middle" dominant-baseline="central">JSON summaries</text>
</svg>
